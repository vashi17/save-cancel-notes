<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Solutions Team ALYSSA (Morsy): Save/Cancel Notes</title>

<style>
    body {
        background-color: #0f172a;
        color: #e5e7eb;
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 20px;
    }

    .container {
        max-width: 900px;
        margin: auto;
        background-color: #020617;
        padding: 25px;
        border-radius: 10px;
        box-shadow: 0 0 15px rgba(0,0,0,0.6);
    }

    h1, h2 {
        text-align: center;
        color: #38bdf8;
    }

    h2 {
        margin-top: 10px;
        font-size: 20px;
    }

    .logo {
        display: block;
        margin: 0 auto 15px;
        max-height: 80px;
    }

    label {
        display: block;
        margin-top: 15px;
        font-weight: bold;
    }

    input[type="text"], textarea {
        width: 100%;
        padding: 8px;
        border-radius: 5px;
        border: none;
        margin-top: 6px;
        background: #1e293b;
        color: #e5e7eb;
    }

    textarea {
        resize: vertical;
        min-height: 60px;
    }

    .toggle-group button {
        margin: 6px 5px 0 0;
        padding: 6px 12px;
        border-radius: 5px;
        border: none;
        cursor: pointer;
        background-color: #334155;
        color: #e5e7eb;
    }

    .toggle-group button.active {
        background-color: #38bdf8;
        color: #020617;
        font-weight: bold;
    }

    .checkbox-group {
        margin-top: 8px;
    }

    .checkbox-group label {
        font-weight: normal;
        margin-top: 8px;
    }

    .actions {
        text-align: center;
        margin-top: 25px;
    }

    .actions button {
        padding: 10px 18px;
        margin: 5px;
        font-size: 15px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
    }

    .generate {
        background-color: #22c55e;
        color: #020617;
    }

    .clear {
        background-color: #ef4444;
        color: #ffffff;
    }

    pre {
        background-color: #020617;
        padding: 15px;
        border-radius: 6px;
        margin-top: 20px;
        white-space: pre-wrap;
        display: none;
    }
</style>
</head>

<body>

<div class="container">

    <img src="logo.png" alt="Company Logo" class="logo">

    <h1>Solutions Team ALYSSA (Morsy): Save/Cancel Notes</h1>
    <h2>CUSTOMER REQUESTED TO CANCEL SERVICE</h2>

    <label>1. Addressed customer by name:</label>
    <div class="toggle-group" data-id="nameAddressed"></div>

    <label>2. Used reflective language / empathy:</label>
    <div class="toggle-group" data-id="reflective"></div>

    <label>3. Reason for cancellation:</label>
    <textarea id="reason"></textarea>

    <label>4. Solutions offered:</label>
    <div class="checkbox-group">
        <label><input type="checkbox"> Explained the value of service</label>
        <label><input type="checkbox"> Outlined the benefits and value of retaining the service</label>
        <label>
            <input type="checkbox"> Offered Price Drop from $
            <input type="text" style="width:80px;"> to $
            <input type="text" style="width:80px;">
        </label>
        <label><input type="checkbox"> Others</label>
    </div>

    <label>5. Apology / empathy expressed:</label>
    <div class="toggle-group" data-id="apology"></div>

    <label>6. Customer response to solutions offered:</label>
    <textarea id="response"></textarea>

    <label>7. Actions taken:</label>
    <div class="checkbox-group">
        <label><input type="checkbox"> Saved from Cancel through building value of service</label>
        <label>
            <input type="checkbox"> Saved from Cancel through Price Drop from $
            <input type="text" style="width:80px;"> to $
            <input type="text" style="width:80px;">
        </label>
        <label>
            <input type="checkbox"> Saved from Cancel through Postponement to
            <input type="text" style="width:150px;">
        </label>
        <label><input type="checkbox"> Processed cancellation, removed card, and sent confirmation email</label>
    </div>

    <label>8. Coordination steps with local team:</label>
    <textarea></textarea>

    <label>9. Asked for permission to put on hold:</label>
    <div class="toggle-group" data-id="holdPermission"></div>

    <label>10. Asked if additional help was needed:</label>
    <div class="toggle-group" data-id="helpAsk"></div>

    <div class="actions">
        <button class="generate" onclick="generateForm()">Generate & Copy</button>
        <button class="clear" onclick="clearForm()">Clear Form</button>
    </div>

    <pre id="output"></pre>

</div>

<script>
function createToggle(container, defaultValue) {
    ["Yes", "No", "N/A"].forEach(val => {
        const btn = document.createElement("button");
        btn.textContent = val;
        if (val === defaultValue) btn.classList.add("active");
        btn.onclick = () => {
            [...container.children].forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
        };
        container.appendChild(btn);
    });
}

document.querySelectorAll(".toggle-group").forEach(group => {
    let def = "No";
    if (["nameAddressed","reflective","apology","helpAsk"].includes(group.dataset.id)) def = "Yes";
    if (group.dataset.id === "holdPermission") def = "N/A";
    createToggle(group, def);
});

function getToggleValue(group) {
    return group.querySelector(".active").textContent;
}

function generateForm() {
    let text = "CUSTOMER REQUESTED TO CANCEL SERVICE\n\n";
    document.querySelectorAll(".toggle-group").forEach(g => {
        text += g.previousElementSibling.innerText + " " + getToggleValue(g) + "\n";
    });
    document.getElementById("output").textContent = text;
    document.getElementById("output").style.display = "block";
    navigator.clipboard.writeText(text);
}

function clearForm() {
    document.querySelectorAll("input[type=text], textarea").forEach(e => e.value = "");
    document.querySelectorAll("input[type=checkbox]").forEach(e => e.checked = false);
    document.querySelectorAll(".toggle-group").forEach(g => {
        let def = "No";
        if (["nameAddressed","reflective","apology","helpAsk"].includes(g.dataset.id)) def = "Yes";
        if (g.dataset.id === "holdPermission") def = "N/A";
        [...g.children].forEach(b => {
            b.classList.toggle("active", b.textContent === def);
        });
    });
    document.getElementById("output").style.display = "none";
}
</script>

</body>
</html>
