<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Solutions Team ALYSSA (Morsy): Save/Cancel Notes</title>

<style>
body {
  background: #0f172a;
  color: #e5e7eb;
  font-family: Arial, Helvetica, sans-serif;
  padding: 20px;
}

.container {
  max-width: 1000px;
  margin: auto;
  background: #020617;
  padding: 25px;
  border-radius: 12px;
  box-shadow: 0 0 25px rgba(0,0,0,0.6);
}

.logo {
  display: block;
  margin: 0 auto 15px;
  max-height: 80px;
}

h1 {
  text-align: center;
  color: #38bdf8;
  font-size: 22px;
}

h2 {
  text-align: center;
  font-size: 16px;
  margin-bottom: 25px;
}

label {
  display: block;
  font-weight: bold;
  margin-top: 16px;
}

textarea,
input[type="text"] {
  width: 100%;
  background: #1e293b;
  color: #e5e7eb;
  border: none;
  border-radius: 6px;
  padding: 8px;
  margin-top: 6px;
}

textarea {
  min-height: 70px;
}

.inline {
  width: 120px;
}

.toggle-group button {
  margin-right: 8px;
  margin-top: 6px;
  padding: 6px 14px;
  background: #334155;
  color: #e5e7eb;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}

.toggle-group button.active {
  background: #38bdf8;
  color: #020617;
  font-weight: bold;
}

.checkbox-group label {
  font-weight: normal;
  margin-top: 6px;
}

.actions {
  text-align: center;
  margin-top: 25px;
}

.actions button {
  padding: 12px 22px;
  font-size: 15px;
  margin: 6px;
  border-radius: 8px;
  border: none;
  cursor: pointer;
}

.generate {
  background: #22c55e;
  color: #020617;
}

.clear {
  background: #ef4444;
  color: #ffffff;
}

#summary {
  min-height: 260px;
  margin-top: 15px;
}
</style>
</head>

<body>

<div class="container">

<img src="logo.png" alt="Logo" class="logo">

<h1>Solutions Team ALYSSA (Morsy): Save/Cancel Notes</h1>
<h2>CUSTOMER REQUESTED TO CANCEL SERVICE</h2>

<label>Addressed customer by name (Y/N)</label>
<div class="toggle-group" data-id="name"></div>

<label>Used reflective language / empathy (Y/N)</label>
<div class="toggle-group" data-id="reflective"></div>

<label>Reason for cancellation</label>
<textarea id="reason"></textarea>

<label>Solution(s) offered</label>
<div class="checkbox-group" id="solutions">
  <label><input type="checkbox"> Explained the value of service</label>
  <label><input type="checkbox"> Outlined the benefits and value of retaining the service</label>
  <label>
    <input type="checkbox"> Offered Price Drop from $
    <input type="text" class="inline"> to $
    <input type="text" class="inline">
  </label>
  <label>
    <input type="checkbox"> Others:
    <input type="text">
  </label>
</div>

<label>Apology / empathy expressed (Y/N)</label>
<div class="toggle-group" data-id="apology"></div>

<label>Customer response to solutions offered</label>
<textarea id="response"></textarea>

<label>Actions taken in account</label>
<div class="checkbox-group" id="actions">
  <label><input type="checkbox"> Saved from Cancel through building value of service</label>
  <label>
    <input type="checkbox"> Saved from Cancel through Price Drop from $
    <input type="text" class="inline"> to $
    <input type="text" class="inline">
  </label>
  <label>
    <input type="checkbox"> Saved from Cancel through Postponement to
    <input type="text" class="inline">
  </label>
  <label>
    <input type="checkbox"> Processed the cancellation, removed card on file, and sent confirmation email
  </label>
</div>

<label>Coordination steps taken (if applicable)</label>
<textarea id="coordination"></textarea>

<label>Asked for permission to put on hold (Yes/No/N/A)</label>
<div class="toggle-group" data-id="hold"></div>

<label>Asked if additional help was needed (Y/N)</label>
<div class="toggle-group" data-id="help"></div>

<div class="actions">
  <button class="generate" onclick="generateSummary()">Summarize & Copy</button>
  <button class="clear" onclick="clearForm()">Clear Form</button>
</div>

<label>Generated Summary (editable)</label>
<textarea id="summary"></textarea>

</div>

<script>
const defaults = {
  name: "Yes",
  reflective: "Yes",
  apology: "Yes",
  help: "Yes",
  hold: "N/A"
};

function setupToggles() {
  document.querySelectorAll(".toggle-group").forEach(group => {
    ["Yes","No","N/A"].forEach(option => {
      const btn = document.createElement("button");
      btn.textContent = option;
      if (option === defaults[group.dataset.id]) btn.classList.add("active");
      btn.onclick = () => {
        group.querySelectorAll("button").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
      };
      group.appendChild(btn);
    });
  });
}

function getToggle(id) {
  return document.querySelector(`.toggle-group[data-id="${id}"] .active`)?.textContent || "N/A";
}

function getCheckboxData(container) {
  const out = [];
  container.querySelectorAll("label").forEach(label => {
    const cb = label.querySelector("input[type=checkbox]");
    if (cb && cb.checked) {
      let line = label.innerText.trim();
      label.querySelectorAll("input[type=text]").forEach(t => {
        if (t.value) line += " " + t.value;
      });
      out.push("- " + line);
    }
  });
  return out.length ? out.join("\n") : "- None";
}

function generateSummary() {
  let s = "CUSTOMER REQUESTED TO CANCEL SERVICE\n\n";

  s += "Addressed customer by name (Y/N): " + getToggle("name") + "\n";
  s += "Used reflective language / empathy (Y/N): " + getToggle("reflective") + "\n\n";

  s += "Reason for cancellation:\n" + reason.value + "\n\n";
  s += "Solution(s) offered:\n" + getCheckboxData(solutions) + "\n\n";
  s += "Apology / empathy expressed (Y/N): " + getToggle("apology") + "\n\n";
  s += "Customer response to solutions offered:\n" + response.value + "\n\n";
  s += "Actions taken in account:\n" + getCheckboxData(actions) + "\n\n";
  s += "Coordination steps taken:\n" + coordination.value + "\n\n";
  s += "Asked for permission to put on hold (Yes/No/N/A): " + getToggle("hold") + "\n";
  s += "Asked if additional help was needed (Y/N): " + getToggle("help");

  summary.value = s;
  navigator.clipboard.writeText(s);
}

function clearForm() {
  document.querySelectorAll("textarea, input[type=text]").forEach(e => e.value = "");
  document.querySelectorAll("input[type=checkbox]").forEach(e => e.checked = false);

  document.querySelectorAll(".toggle-group").forEach(group => {
    const def = defaults[group.dataset.id];
    group.querySelectorAll("button").forEach(btn => {
      btn.classList.toggle("active", btn.textContent === def);
    });
  });
}

setupToggles();
</script>

</body>
</html>
