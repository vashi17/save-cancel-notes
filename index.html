<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Solutions Team ALYSSA (Morsy): Save/Cancel Notes</title>

<style>
body {
  background: #0f172a;
  color: #e5e7eb;
  font-family: Arial, Helvetica, sans-serif;
  padding: 20px;
}

.container {
  max-width: 1000px;
  margin: auto;
  background: #020617;
  padding: 25px;
  border-radius: 12px;
  box-shadow: 0 0 25px rgba(0,0,0,0.6);
}

.logo {
  display: block;
  margin: 0 auto 15px;
  max-height: 80px;
}

h1 {
  text-align: center;
  color: #38bdf8;
  font-size: 22px;
}

h2 {
  text-align: center;
  font-size: 16px;
  margin-bottom: 25px;
}

label {
  display: block;
  font-weight: bold;
  margin-top: 16px;
}

textarea,
input[type="text"] {
  width: 100%;
  background: #1e293b;
  color: #e5e7eb;
  border: none;
  border-radius: 6px;
  padding: 8px;
  margin-top: 6px;
}

textarea {
  min-height: 70px;
}

.inline {
  width: 120px;
}

.toggle-group button {
  margin-right: 8px;
  margin-top: 6px;
  padding: 6px 14px;
  background: #334155;
  color: #e5e7eb;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}

.toggle-group button.active {
  background: #38bdf8;
  color: #020617;
  font-weight: bold;
}

.checkbox-group label {
  font-weight: normal;
  margin-top: 6px;
}

.actions {
  text-align: center;
  margin-top: 25px;
}

.actions button {
  padding: 12px 22px;
  font-size: 15px;
  margin: 6px;
  border-radius: 8px;
  border: none;
  cursor: pointer;
}

.generate {
  background: #22c55e;
  color: #020617;
}

.clear {
  background: #ef4444;
  color: #ffffff;
}

#summary {
  min-height: 260px;
  margin-top: 15px;
}
</style>
</head>

<body>

<div class="container">

<img src="logo.png" alt="Logo" class="logo">

<h1>Solutions Team ALYSSA (Morsy): Save/Cancel Notes</h1>
<h2>CUSTOMER REQUESTED TO CANCEL SERVICE</h2>

<label>Addressed customer by name (Y/ N)</label>
<div class="toggle-group" data-id="name"></div>

<label>Used reflective language to repeat customer’s experience back to them / express empathy in my own words (Y/N)</label>
<div class="toggle-group" data-id="reflective"></div>

<label>Reason for cancellation</label>
<textarea id="reason"></textarea>

<label>Solution(s) offered</label>
<div class="checkbox-group" id="solutions">
  <label><input type="checkbox"> Explain of the value of service</label>
  <label><input type="checkbox"> Outlined the benefits and value of retaining the service</label>
  <label>
    <input type="checkbox"> Offered Price Drop from $
    <input type="text" class="inline"> to $
    <input type="text" class="inline">
  </label>
  <label>
    <input type="checkbox"> Others:
    <input type="text">
  </label>
</div>

<label>Apology / empathy expressed? (Y/N)</label>
<div class="toggle-group" data-id="apology"></div>

<label>Customer response to solution(s) offered</label>
<textarea id="response"></textarea>

<label>List actions taken in account to set up save and / or cancel</label>
<div class="checkbox-group" id="actions">
  <label><input type="checkbox"> Saved from Cancel through building value of service</label>
  <label>
    <input type="checkbox"> Saved from Cancel through Price Drop from $
    <input type="text" class="inline"> to $
    <input type="text" class="inline">
  </label>
  <label>
    <input type="checkbox"> Saved from Cancel through Postponement to
    <input type="text" class="inline">
  </label>
  <label>
    <input type="checkbox"> Processed the cancellation of Account, removed card on file and sent email to the customer for the account closure confirmation
  </label>
</div>

<label>List coordination steps taken with local completed if applicable</label>
<textarea id="coordination"></textarea>

<label>Asked for permission to put on hold (Yes/ N/NA)</label>
<div class="toggle-group" data-id="hold"></div>

<label>Asked customer if there was anything I could do to help before ending call (Y/N)</label>
<div class="toggle-group" data-id="help"></div>

<div class="actions">
  <button class="generate" onclick="generateSummary()">Summarize & Copy</button>
  <button class="clear" onclick="clearForm()">Clear Form</button>
</div>

<label>Generated Summary (editable)</label>
<textarea id="summary"></textarea>

</div>

<script>
const defaults = {
  name: "Yes",
  reflective: "Yes",
  apology: "Yes",
  help: "Yes",
  hold: "N/A"
};

function setupToggles() {
  document.querySelectorAll(".toggle-group").forEach(group => {
    ["Yes","No","N/A"].forEach(option => {
      const btn = document.createElement("button");
      btn.textContent = option;
      if (option === defaults[group.dataset.id]) btn.classList.add("active");
      btn.onclick = () => {
        group.querySelectorAll("button").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
      };
      group.appendChild(btn);
    });
  });
}

function getToggle(id) {
  return document.querySelector(`.toggle-group[data-id="${id}"] .active`)?.textContent || "N/A";
}

/* ✅ FIXED CHECKBOX PARSER */
function getCheckboxData(container) {
  const lines = [];

  container.querySelectorAll("label").forEach(label => {
    const cb = label.querySelector("input[type=checkbox]");
    if (!cb || !cb.checked) return;

    const textInputs = label.querySelectorAll("input[type=text]");
    const labelText = label.textContent;

    // ✅ PRICE DROP (two inputs)
    if (labelText.includes("Price Drop") && textInputs.length === 2) {
      const from = textInputs[0].value || "___";
      const to = textInputs[1].value || "___";
      lines.push(`- Offered Price Drop from $${from} to $${to}`);
      return;
    }

    // ✅ POSTPONEMENT (one input)
    if (labelText.includes("Postponement") && textInputs.length === 1) {
      const date = textInputs[0].value || "___";
      lines.push(`- Saved from Cancel through Postponement to ${date}`);
      return;
    }

    // ✅ OTHERS (free text)
    if (labelText.includes("Others") && textInputs.length === 1) {
      const other = textInputs[0].value || "";
      lines.push(`- Others: ${other}`);
      return;
    }

    // ✅ NORMAL CHECKBOX (no text inputs)
    const cleanText = labelText
      .replace(/\s+/g, " ")
      .trim();

    lines.push(`- ${cleanText}`);
  });

  return lines.length ? lines.join("\n") : "- None";
}

function generateSummary() {
  let s = "CUSTOMER REQUESTED TO CANCEL SERVICE\n\n";

  s += "Addressed customer by name (Y/ N): " + getToggle("name") + "\n";
  s += "Used reflective language to repeat customer’s experience back to them / express empathy in my own words (Y/N): " + getToggle("reflective") + "\n\n";
  s += "Reason for cancellation:\n" + reason.value + "\n\n";
  s += "Solution(s) offered:\n" + getCheckboxData(solutions) + "\n\n";
  s += "Apology / empathy expressed? (Y/N): " + getToggle("apology") + "\n\n";
  s += "Customer response to solution(s) offered:\n" + response.value + "\n\n";
  s += "List actions taken in account to set up save and / or cancel:\n" + getCheckboxData(actions) + "\n\n";
  s += "List coordination steps taken with local completed if applicable:\n" + coordination.value + "\n\n";
  s += "Asked for permission to put on hold (Yes/ N/NA): " + getToggle("hold") + "\n";
  s += "Asked customer if there was anything I could do to help before ending call (Y/N): " + getToggle("help");

  summary.value = s;
  navigator.clipboard.writeText(s);
}

function clearForm() {
  document.querySelectorAll("textarea, input[type=text]").forEach(e => e.value = "");
  document.querySelectorAll("input[type=checkbox]").forEach(e => e.checked = false);

  document.querySelectorAll(".toggle-group").forEach(group => {
    const def = defaults[group.dataset.id];
    group.querySelectorAll("button").forEach(btn => {
      btn.classList.toggle("active", btn.textContent === def);
    });
  });
}

setupToggles();
</script>

</body>
</html>
