<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Solutions Team ALYSSA (Morsy): Save/Cancel Notes</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #f5f5f5;
        padding: 20px;
    }

    .container {
        max-width: 900px;
        margin: auto;
        background: #ffffff;
        padding: 25px;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    h1 {
        text-align: center;
    }

    h2 {
        text-align: center;
        margin-top: 5px;
        font-size: 18px;
    }

    label {
        font-weight: bold;
        display: block;
        margin-top: 15px;
    }

    textarea, input[type="text"] {
        width: 100%;
        padding: 8px;
        margin-top: 5px;
    }

    .toggle-group button {
        margin-right: 6px;
        margin-top: 5px;
        padding: 5px 10px;
        cursor: pointer;
    }

    .active {
        background: #2563eb;
        color: white;
        font-weight: bold;
    }

    .checkbox-group label {
        font-weight: normal;
        margin-top: 6px;
    }

    .actions {
        text-align: center;
        margin-top: 25px;
    }

    .actions button {
        padding: 10px 18px;
        margin: 6px;
        font-size: 14px;
        cursor: pointer;
    }

    textarea#summary {
        min-height: 220px;
        margin-top: 15px;
    }
</style>
</head>

<body>

<div class="container">

<h1>Solutions Team ALYSSA (Morsy): Save/Cancel Notes</h1>
<h2>CUSTOMER REQUESTED TO CANCEL SERVICE</h2>

<!-- Toggles -->
<label>Addressed customer by name:</label>
<div class="toggle-group" data-default="Yes"></div>

<label>Used reflective language / empathy:</label>
<div class="toggle-group" data-default="Yes"></div>

<label>Reason for cancellation:</label>
<textarea id="reason"></textarea>

<label>Solution(s) offered:</label>
<div class="checkbox-group">
    <label><input type="checkbox"> Explained the value of service</label>
    <label><input type="checkbox"> Outlined the benefits and value of retaining the service</label>
    <label>
        <input type="checkbox"> Offered Price Drop from $
        <input type="text" style="width:80px"> to $
        <input type="text" style="width:80px">
    </label>
    <label><input type="checkbox"> Others</label>
</div>

<label>Apology / empathy expressed:</label>
<div class="toggle-group" data-default="Yes"></div>

<label>Customer response to solutions offered:</label>
<textarea id="response"></textarea>

<label>Actions taken:</label>
<div class="checkbox-group">
    <label><input type="checkbox"> Saved from Cancel through building value of service</label>
    <label>
        <input type="checkbox"> Saved from Cancel through Price Drop from $
        <input type="text" style="width:80px"> to $
        <input type="text" style="width:80px">
    </label>
    <label>
        <input type="checkbox"> Saved from Cancel through Postponement to
        <input type="text" style="width:120px">
    </label>
    <label><input type="checkbox"> Processed the cancellation of Account</label>
</div>

<label>Coordination steps taken (if applicable):</label>
<textarea></textarea>

<label>Asked for permission to put on hold:</label>
<div class="toggle-group" data-default="N/A"></div>

<label>Asked if additional help was needed:</label>
<div class="toggle-group" data-default="Yes"></div>

<div class="actions">
    <button onclick="generateSummary()">Generate & Copy</button>
    <button onclick="clearForm()">Clear Form</button>
</div>

<label>Generated Summary (Fully Editable):</label>
<textarea id="summary"></textarea>

</div>

<script>
function createToggles() {
    document.querySelectorAll('.toggle-group').forEach(group => {
        ["Yes","No","N/A"].forEach(val => {
            const btn = document.createElement("button");
            btn.textContent = val;
            if (val === group.dataset.default) btn.classList.add("active");
            btn.onclick = () => {
                group.querySelectorAll("button").forEach(b => b.classList.remove("active"));
                btn.classList.add("active");
            };
            group.appendChild(btn);
        });
    });
}

function getToggleValue(group) {
    return group.querySelector(".active").textContent;
}

function generateSummary() {
    let summary = "CUSTOMER REQUESTED TO CANCEL SERVICE\n\n";

    document.querySelectorAll(".toggle-group").forEach(group => {
        const label = group.previousElementSibling.innerText;
        summary += `${label} ${getToggleValue(group)}\n`;
    });

    summary += "\nReason for Cancellation:\n" + document.getElementById("reason").value + "\n";
    summary += "\nCustomer Response:\n" + document.getElementById("response").value;

    document.getElementById("summary").value = summary;
    navigator.clipboard.writeText(summary);
}

function clearForm() {
    document.querySelectorAll("textarea, input[type=text]").forEach(el => el.value = "");
    document.querySelectorAll("input[type=checkbox]").forEach(el => el.checked = false);

    document.querySelectorAll(".toggle-group").forEach(group => {
        const def = group.dataset.default;
        group.querySelectorAll("button").forEach(btn => {
            btn.classList.toggle("active", btn.textContent === def);
        });
    });
}

createToggles();
</script>

</body>
</html>
