<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Solutions Team ALYSSA (Morsy): Save/Cancel Notes</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background-color: #0b1220;
    color: #e5e7eb;
}

.container {
    max-width: 950px;
    margin: auto;
    padding: 30px;
}

h1 {
    text-align: center;
    color: #22c55e;
    margin-bottom: 30px;
}

label {
    display: block;
    font-weight: bold;
    margin-top: 20px;
}

textarea, input[type="text"], input[type="number"], select {
    width: 100%;
    padding: 10px;
    margin-top: 8px;
    background-color: #020617;
    color: #e5e7eb;
    border: 1px solid #334155;
    border-radius: 6px;
}

textarea {
    min-height: 80px;
}

.inline {
    width: 120px;
    margin: 0 5px;
}

.checkbox-group label {
    font-weight: normal;
    margin-top: 10px;
}

.buttons {
    display: flex;
    gap: 15px;
    margin-top: 30px;
}

button {
    flex: 1;
    padding: 14px;
    font-size: 16px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
}

.generate {
    background-color: #22c55e;
    color: #022c22;
}

.clear {
    background-color: #ef4444;
    color: #ffffff;
}

.output {
    margin-top: 30px;
    background-color: #020617;
    border: 1px solid #334155;
    border-radius: 6px;
    padding: 15px;
}
</style>
</head>

<body>
<div class="container">

<h1>Solutions Team ALYSSA (Morsy): Save/Cancel Notes</h1>

<label>Addressed customer by name</label>
<select id="addressed">
<option>Yes</option>
<option>No</option>
<option>N/A</option>
</select>

<label>Used reflective language / empathy</label>
<select id="reflective">
<option>Yes</option>
<option>No</option>
<option>N/A</option>
</select>

<label>Reason for cancellation</label>
<textarea id="reason"></textarea>

<label>Apology / empathy expressed</label>
<select id="apology">
<option>Yes</option>
<option>No</option>
<option>N/A</option>
</select>

<label>Customer response</label>
<textarea id="response"></textarea>

<label>Coordination steps</label>
<textarea id="coordination"></textarea>

<label>Permission to put on hold</label>
<select id="hold">
<option>Yes</option>
<option>No</option>
<option>N/A</option>
</select>

<label>Asked if additional help was needed</label>
<select id="help">
<option>Yes</option>
<option>No</option>
<option>N/A</option>
</select>

<div class="buttons">
<button class="generate" onclick="generateNotes()">Generate & Copy Notes</button>
<button class="clear" onclick="clearForm()">Clear Entire Form</button>
</div>

<textarea id="output" class="output"
placeholder="Generated summary will appear here. You can edit it before copying...">
</textarea>

<div class="buttons">
<button onclick="copySummary()">Copy Summary</button>
<button onclick="clearSummary()">Clear Summary</button>
</div>

</div>

<script>
function generateNotes() {
let text = "CUSTOMER REQUESTED TO CANCEL SERVICE\n\n";

text += "Addressed customer by name: " + addressed.value + "\n";
text += "Used reflective language / empathy: " + reflective.value + "\n\n";
text += "Reason for cancellation:\n" + reason.value + "\n\n";
text += "Apology / empathy expressed: " + apology.value + "\n\n";
text += "Customer response:\n" + response.value + "\n\n";
text += "Coordination steps:\n" + coordination.value + "\n\n";
text += "Permission to put on hold: " + hold.value + "\n";
text += "Asked if additional help was needed: " + help.value;

navigator.clipboard.writeText(text);
document.getElementById("output").value = text;
}

function copySummary() {
const output = document.getElementById("output");
if (!output.value.trim()) return;
output.select();
navigator.clipboard.writeText(output.value);
}

function clearSummary() {
document.getElementById("output").value = "";
}

function clearForm() {
document.querySelectorAll("input, textarea, select").forEach(el => {
if (el.type === "checkbox") el.checked = false;
else el.value = "";
});
document.getElementById("output").value = "";
}
</script>

</body>
</html>
