<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Solutions Team ALYSSA (Morsy): Save/Cancel Notes</title>

<style>
body {
    font-family: Arial, sans-serif;
    background-color: #f4f4f4;
    padding: 20px;
}

.container {
    background-color: #ffffff;
    max-width: 900px;
    margin: auto;
    padding: 25px;
    border-radius: 8px;
}

h1, h2 {
    text-align: center;
}

label {
    font-weight: bold;
    display: block;
    margin-top: 15px;
}

textarea, input[type="text"] {
    width: 100%;
    margin-top: 6px;
    padding: 8px;
}

.toggle-group button {
    margin-top: 5px;
    margin-right: 5px;
    padding: 6px 12px;
    border: 1px solid #ccc;
    cursor: pointer;
    background: #eee;
}

.toggle-group button.active {
    background: #2563eb;
    color: white;
    font-weight: bold;
}

.checkbox-group label {
    font-weight: normal;
    margin-top: 5px;
}

.actions {
    margin-top: 25px;
    text-align: center;
}

.actions button {
    padding: 10px 18px;
    margin: 6px;
    font-size: 14px;
    cursor: pointer;
}

#summary {
    margin-top: 15px;
    min-height: 220px;
}
</style>
</head>

<body>

<div class="container">

<h1>Solutions Team ALYSSA (Morsy): Save/Cancel Notes</h1>
<h2>CUSTOMER REQUESTED TO CANCEL SERVICE</h2>

<label>Addressed customer by name:</label>
<div class="toggle-group" data-default="Yes"></div>

<label>Used reflective language / empathy:</label>
<div class="toggle-group" data-default="Yes"></div>

<label>Reason for cancellation:</label>
<textarea id="reason"></textarea>

<label>Solution(s) offered:</label>
<div class="checkbox-group">
    <label><input type="checkbox"> Explained the value of service</label>
    <label><input type="checkbox"> Outlined the benefits and value of retaining the service</label>
    <label>
        <input type="checkbox"> Offered Price Drop from $
        <input type="text" style="width:90px"> to $
        <input type="text" style="width:90px">
    </label>
    <label><input type="checkbox"> Others</label>
</div>

<label>Apology / empathy expressed:</label>
<div class="toggle-group" data-default="Yes"></div>

<label>Customer response to solutions offered:</label>
<textarea id="response"></textarea>

<label>Actions taken in account:</label>
<div class="checkbox-group">
    <label><input type="checkbox"> Saved from Cancel through building value of service</label>
    <label>
        <input type="checkbox"> Saved from Cancel through Price Drop from $
        <input type="text" style="width:90px"> to $
        <input type="text" style="width:90px">
    </label>
    <label>
        <input type="checkbox"> Saved from Cancel through Postponement to
        <input type="text" style="width:140px">
    </label>
    <label><input type="checkbox"> Processed the cancellation of Account</label>
</div>

<label>Coordination steps taken (if applicable):</label>
<textarea></textarea>

<label>Asked for permission to put on hold:</label>
<div class="toggle-group" data-default="N/A"></div>

<label>Asked if additional help was needed:</label>
<div class="toggle-group" data-default="Yes"></div>

<div class="actions">
    <button onclick="generateSummary()">Generate & Copy Summary</button>
    <button onclick="clearForm()">Clear Form</button>
</div>

<label>Generated Summary (Editable & Deletable):</label>
<textarea id="summary"></textarea>

</div>

<script>
function setupToggles() {
    document.querySelectorAll('.toggle-group').forEach(group => {
        ["Yes","No","N/A"].forEach(value => {
            const btn = document.createElement("button");
            btn.textContent = value;
            if (value === group.dataset.default) btn.classList.add("active");
            btn.onclick = () => {
                group.querySelectorAll("button").forEach(b => b.classList.remove("active"));
                btn.classList.add("active");
            };
            group.appendChild(btn);
        });
    });
}

function getToggleValue(group) {
    return group.querySelector(".active").textContent;
}

function generateSummary() {
    let text = "CUSTOMER REQUESTED TO CANCEL SERVICE\n\n";

    document.querySelectorAll(".toggle-group").forEach(group => {
        text += group.previousElementSibling.innerText + " " + getToggleValue(group) + "\n";
    });

    text += "\nReason for Cancellation:\n" + document.getElementById("reason").value + "\n";
    text += "\nCustomer Response to Solutions:\n" + document.getElementById("response").value;

    document.getElementById("summary").value = text;
    navigator.clipboard.writeText(text);
}

function clearForm() {
    document.querySelectorAll("textarea, input[type=text]").forEach(e => e.value = "");
    document.querySelectorAll("input[type=checkbox]").forEach(e => e.checked = false);

    document.querySelectorAll(".toggle-group").forEach(group => {
        let def = group.dataset.default;
        if (group.previousElementSibling.innerText.includes("permission to put on hold")) {
            def = "N/A";
        }
        if (
            group.previousElementSibling.innerText.includes("Addressed customer") ||
            group.previousElementSibling.innerText.includes("reflective") ||
            group.previousElementSibling.innerText.includes("Apology") ||
            group.previousElementSibling.innerText.includes("additional help")
        ) {
            def = "Yes";
        }
        group.querySelectorAll("button").forEach(btn => {
            btn.classList.toggle("active", btn.textContent === def);
        });
    });
}

setupToggles();
</script>

</body>
</html>
